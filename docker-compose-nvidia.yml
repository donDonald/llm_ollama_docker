services:




    ollama:
        image: ollama/ollama:latest
        container_name: ollama
        ports:
            - "11434:11434"
        volumes:
            - ollama_data:/root/.ollama
        restart: unless-stopped
        # If NVIDIA GPU is available, uncomment the following to enable GPU acceleration
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]




    open-webui:
        image: ghcr.io/open-webui/open-webui:main
        container_name: open-webui
        ports:
            - "3531:8080"
        volumes:
            - open_webui_data:/app/backend/data
        environment:
            - OLLAMA_BASE_URL=http://ollama:11434
        depends_on:
            - ollama
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: unless-stopped




volumes:
    ollama_data:
    open_webui_data:
